<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
{% block title %}
SmartSISS
{% endblock %}
</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>


*{

box-sizing:border-box;

}



body{

    margin:0;

    font-family:'Poppins',sans-serif;

    background:#f4f7ff;

}



/* MENU LATERAL */


.sidebar{


    position:fixed;

    width:250px;

    height:100vh;

    background:linear-gradient(
        180deg,
        #123b7a,
        #1e5bb8
    );

    color:white;

    padding-top:25px;

    box-shadow:5px 0 20px rgba(0,0,0,.15);


}



.sidebar h2{


    text-align:center;

    margin-bottom:45px;

    font-weight:700;

}



.sidebar a{


    display:flex;

    align-items:center;

    gap:12px;

    color:white;

    padding:15px 25px;

    text-decoration:none;

    transition:.3s;


}



.sidebar a:hover{


    background:rgba(255,255,255,.15);

    padding-left:35px;


}



/* CERRAR SESION */


.logout{


    position:absolute;

    bottom:35px;

    width:100%;


}



.logout button{


    width:85%;

    margin-left:20px;

    background:white;

    color:#123b7a;

    border:none;

    padding:12px;

    border-radius:12px;

    font-weight:600;

}



.logout button:hover{


    background:#eaf3ff;

}



/* CONTENIDO */


.content{


    margin-left:250px;

    padding:35px;

    width:calc(100% - 250px);


}



.main-card{


    background:white;

    padding:30px;

    border-radius:25px;

    box-shadow:

    0 10px 30px rgba(0,0,0,.08);


}



/* BOTONES */


button{


    cursor:pointer;

}



table{


    background:white;

    border-collapse:collapse;

}



th{


    background:#123b7a;

    color:white;


}



td,th{


    padding:12px;


}




</style>


</head>



<body>



<div class="sidebar">



<h2>

<i class="bi bi-mortarboard-fill"></i>

SmartSISS

</h2>




<a href="/">

<i class="bi bi-house-fill"></i>

Inicio

</a>




<a href="/perfil/">

<i class="bi bi-person-circle"></i>

Perfil

</a>





<a href="/inscripcion/">

<i class="bi bi-journal-check"></i>

Inscripción

</a>





<a href="/kardex/">

<i class="bi bi-file-earmark-text"></i>

Kardex

</a>





<div class="logout">


<a href="/cerrar-sesion/">


<button>

<i class="bi bi-box-arrow-right"></i>

Cerrar sesión

</button>


</a>


</div>



</div>







<div class="content">



<div class="main-card">


{% block content %}

{% endblock %}


</div>


</div>





</body>


</html>
