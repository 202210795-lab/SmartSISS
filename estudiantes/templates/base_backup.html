<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
{% block title %}
SmartSISS
{% endblock %}
</title>


<style>

body{

    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6fb;

}


.sidebar{

    position:fixed;
    width:240px;
    height:100vh;
    background:#123b7a;
    color:white;
    padding-top:20px;

}


.sidebar h2{

    text-align:center;
    margin-bottom:40px;

}


.sidebar a{

    display:block;
    color:white;
    padding:15px 25px;
    text-decoration:none;

}


.sidebar a:hover{

    background:#1e5bb8;

}



.logout{

    position:absolute;
    bottom:30px;
    width:100%;

}



.content{

    margin-left:240px;
    padding:30px;

}



.card{

    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px #ccc;

}



button{

    background:#123b7a;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;

}


button:hover{

    background:#1e5bb8;

}


table{

    background:white;
    border-collapse:collapse;

}


th{

    background:#123b7a;
    color:white;

}


td,th{

    padding:12px;

}


</style>


</head>



<body>


<div class="sidebar">


<h2>
SmartSISS
</h2>


<a href="/perfil/">
👤 Perfil
</a>


<a href="/gestion/">
📚 Inscripción
</a>


<a href="/kardex/">
📄 Kardex
</a>



<div class="logout">

<a href="/cerrar-sesion/">

<button>
Cerrar sesión
</button>

</a>

</div>


</div>




<div class="content">


<div class="card">


{% block content %}

{% endblock %}


</div>


</div>


</body>


</html>
