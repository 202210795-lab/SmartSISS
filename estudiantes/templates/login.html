<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ingreso SmartSISS
</title>


<!-- Fuente Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;

    background:linear-gradient(
        135deg,
        #eef5ff,
        #f8f9fc
    );

    display:flex;
    justify-content:center;
    align-items:center;

}



.container-login{

    width:900px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:60px;

}



.login-box{

    width:390px;

    background:white;

    padding:45px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 20px 40px rgba(0,0,0,.12);

}



.logo{

    color:#123b7a;

    font-size:32px;

    font-weight:700;

    margin-bottom:10px;

}



.subtitle{

    color:#667085;

    margin-bottom:35px;

}



.input-group{

    position:relative;

    margin-bottom:20px;

}



.input-group i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#123b7a;

    font-size:18px;

}



input{


    width:100%;

    padding:14px 15px 14px 45px;

    border-radius:12px;

    border:1px solid #d5dbe7;

    outline:none;

    font-family:'Poppins',sans-serif;

}



input:focus{

    border-color:#5575e8;

    box-shadow:0 0 8px rgba(85,117,232,.25);

}



.forgot{

    display:block;

    text-align:right;

    color:#5575e8;

    text-decoration:none;

    font-size:13px;

    margin-bottom:25px;

}



button{


    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#123b7a;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    background:#1e5bb8;

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(30,91,184,.3);

}



.illustration{


    width:320px;

    height:320px;

    background:#dcecff;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:120px;

}



@media(max-width:800px){


.container-login{

    flex-direction:column;

}


.illustration{

    display:none;

}


}



</style>

</head>


<body>


<div class="container-login">



<div class="login-box">


<div class="logo">

SmartSISS - UMSS

</div>


<div class="subtitle">

Ingreso al sistema académico

</div>



<form method="POST">

{% csrf_token %}



<div class="input-group">

<i class="bi bi-person-badge"></i>

<input 
type="text"
name="codigo"
placeholder="Ingrese código SIS"
>


</div>



<div class="input-group">

<i class="bi bi-lock"></i>

<input 
type="password"
name="password"
placeholder="Ingrese contraseña"
>


</div>



<a href="#" class="forgot">

¿Olvidaste tu contraseña?

</a>



<button type="submit">

Ingresar

</button>



</form>


</div>



<div class="illustration">

🎓

</div>



</div>


</body>

</html>
